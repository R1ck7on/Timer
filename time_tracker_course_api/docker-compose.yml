services:
  notifier:
    build: ./notifier
    ports:
      - "8001:8001"

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////data/app.db
      JWT_SECRET: change-me-in-production
      NOTIFIER_URL: http://notifier:8001
    volumes:
      - api_data:/data
    depends_on:
      - notifier

volumes:
  api_data: {}
